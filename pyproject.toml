[project]
name = "archive-graph-spacy"
version = "0.1.5"
description = "spaCy-based named entity recognition utilities for archive graph work"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "databricks-sdk>=0.61,<1.0",
  "duckdb>=1.2,<2.0",
  "python-dotenv>=1.0,<2.0",
  "pyvis>=0.3.2,<0.4",
  "spacy>=3.8,<4.0",
]

[dependency-groups]
dev = [
  "pyyaml>=6.0,<7.0",
  "pytest>=8.3,<9.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true

[project.scripts]
build-nlpdata = "archive_graph_spacy.scripts.build_nlpdata:main"
