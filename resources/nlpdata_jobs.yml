resources:
  jobs:
    nlpdata_backfill:
      name: "${bundle.target}_nlpdata_backfill"
      description: "Run the nlpdata refresh across the agreed historical backfill windows"
      email_notifications:
        on_failure:
          - ${var.notification_email}
      tasks:
        - task_key: backfill_01_1974_2012
          max_retries: 0
          disable_auto_optimization: true
          timeout_seconds: 7200
          notebook_task:
            notebook_path: ../notebooks/01_nlpdata_refresh.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "nlpdata"
              wheel_path: "${var.wheel_path}"
              warehouse_id: "${var.warehouse_id}"
              message_limit: ""
              people_limit: ""
              start_date: "1974-01-01"
              end_date: "2013-01-01"
